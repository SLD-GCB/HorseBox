name: horsebox
description: "HorseBox - HorseUI 专用双端代理客户端"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  horsebox_backend:
    path: ../back-machine
  crypto: ^3.0.7
  path: ^1.9.1
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/rules/geosite-cn.srs
    - assets/rules/geoip-cn.srs
